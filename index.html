<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Marki A-Z Biuro – producenci, serie i modele</title>

  <meta
    name="description"
    content="Poznaj marki, producentów, serie i modele produktów dostępnych w A-Z Biuro. Serwis marki.eazbiuro.pl jest obecnie przygotowywany."
  >

  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f6f7;
      color: #252a30;
      font-family: "Open Sans", Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 820px;
      padding: 48px 40px;
      background: #ffffff;
      border-top: 6px solid #cd0000;
      border-radius: 12px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .label {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 14px;
      background: rgba(205, 0, 0, 0.08);
      color: #cd0000;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 18px;
      color: #cd0000;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.15;
    }

    p {
      margin: 0 auto 28px;
      max-width: 650px;
      color: #59616a;
      font-size: 18px;
      line-height: 1.7;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      color: #ffffff;
      background: #105fa6;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    a:hover,
    a:focus {
      background: #cd0000;
    }

    @media (max-width: 600px) {
      main {
        padding: 36px 22px;
      }

      nav {
        flex-direction: column;
      }

      a {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <span class="label">Nowy serwis A-Z Biuro</span>

    <h1>Marki A-Z Biuro</h1>

    <p>
      Przygotowujemy centrum producentów, marek, serii i modeli produktów
      dostępnych w ofercie A-Z Biuro.
    </p>

    <nav aria-label="Pozostałe serwisy A-Z Biuro">
      <a href="https://eazbiuro.pl/">Sklep A-Z Biuro</a>
      <a href="https://poradnik.eazbiuro.pl/">Poradniki</a>
      <a href="https://wiedza.eazbiuro.pl/">Centrum Wiedzy</a>
    </nav>
  </main>
</body>
</html>
